[project]
name = "multi-modal-personal-knowledge-retriever"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.2.10",
    "langchain-core>=1.2.16",
    "langchain-openai>=1.1.10",
    "langchain-openrouter>=0.1.0",
    "langchain-text-splitters>=1.1.1",
    "langgraph>=1.0.10",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langgraph-cli[inmem]>=0.4.18",
    "loguru>=0.7.3",
    "nest-asyncio>=1.6.0",
    "openai>=2.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.17.0",
    "streamlit>=1.40.0",
    "tavily>=1.1.0",
    "tiktoken>=0.9.0",
    "aiosqlite>=0.22.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.scripts]
jan = "src.main:main"
